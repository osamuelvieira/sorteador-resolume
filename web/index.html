<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Sorteador</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #20242d;
    --line: #2b303b;
    --text: #e9ecf2;
    --muted: #8d95a5;
    --accent: #f5c542;
    --accent-ink: #1b1600;
    --danger: #ef5b5b;
    --ok: #4cc38a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 16px 48px;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 0 12px;
    background: linear-gradient(var(--bg) 80%, transparent);
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 14px; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
  .dot.on { background: var(--ok); }
  .tabs { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .tabs button {
    border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 7px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .tabs button.active { background: var(--panel-2); color: var(--text); }
  main { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 860px) {
    main { grid-template-columns: 1fr 1fr; }
    .wide { grid-column: 1 / -1; }
  }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }

  .stage {
    position: relative; overflow: hidden;
    background: #000; border-radius: 10px; aspect-ratio: 16 / 6;
    display: flex; align-items: center; justify-content: center; text-align: center;
    margin-bottom: 14px; padding: 0 16px;
  }
  #display { font-size: clamp(28px, 7vw, 64px); font-weight: 800; line-height: 1.1; word-break: break-word; }
  #display.result { color: var(--accent); }
  .phase { position: absolute; top: 10px; left: 12px; font-size: 12px; color: var(--muted); }
  .progress { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--accent); width: 0; transition: width .2s linear; }
  .message { color: var(--danger); min-height: 1.4em; margin: -4px 0 10px; font-size: 14px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button.primary, button.secondary, button.ghost {
    font: inherit; font-weight: 600; border-radius: 10px; cursor: pointer; padding: 12px 18px; border: 1px solid transparent;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); flex: 1 1 220px; font-size: 18px; padding: 16px; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.secondary { background: var(--panel-2); color: var(--text); border-color: var(--line); }
  button.ghost { background: none; color: var(--muted); border-color: var(--line); padding: 8px 12px; font-weight: 500; font-size: 13px; }

  label.field { display: block; margin-bottom: 14px; }
  label.field > span, .field-title { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  label.field output { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: inherit;
  }
  textarea { min-height: 220px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .segmented { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .segmented button {
    flex: 1 1 0; font: inherit; padding: 10px; border-radius: 8px; cursor: pointer;
    background: var(--bg); color: var(--muted); border: 1px solid var(--line);
  }
  .segmented button.active { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; cursor: pointer; }
  .switch input { width: 20px; height: 20px; accent-color: var(--accent); }
  .colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .colors label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  input[type=color] { width: 40px; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 2px; }
  .hint { color: var(--muted); font-size: 13px; margin: -6px 0 14px; }
  .hidden { display: none !important; }

  ol#history { margin: 0 0 14px; padding: 0; list-style: none; max-height: 320px; overflow: auto; }
  ol#history li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  ol#history li .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.2em; }
  ol#history li .name { flex: 1; overflow-wrap: anywhere; }
  ol#history li button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 4px; }
  ol#history li button:hover { color: var(--danger); }
  .empty { color: var(--muted); font-size: 14px; }
  footer { max-width: 980px; margin: 20px auto 0; color: var(--muted); font-size: 12px; text-align: center; }
  footer a { color: var(--accent); text-decoration: none; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Sorteador</h1>
  <div class="tabs" id="channels" role="tablist" aria-label="Canal"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Conectando…</span></div>
</header>

<main>
  <section class="wide">
    <div class="stage">
      <span class="phase" id="phase">Aguardando</span>
      <div id="display">—</div>
      <div class="progress" id="progress"></div>
    </div>
    <div class="message" id="message"></div>
    <div class="actions">
      <button class="primary" id="start">Iniciar sorteio</button>
      <button class="secondary" id="clear">Limpar tela</button>
    </div>
  </section>

  <section>
    <h2>O que sortear</h2>
    <div class="segmented" data-key="mode">
      <button data-value="0">Lista de nomes</button>
      <button data-value="1">Números</button>
    </div>
    <div id="listFields">
      <label class="field"><span>Um item por linha <output id="listCount"></output></span>
        <textarea id="listText" data-key="listText" spellcheck="false" placeholder="Ana&#10;Bruno&#10;Carla"></textarea>
      </label>
    </div>
    <div id="numberFields">
      <div class="row">
        <label class="field"><span>Número inicial</span><input type="number" data-key="numMin" step="1"></label>
        <label class="field"><span>Número final</span><input type="number" data-key="numMax" step="1"></label>
      </div>
      <label class="switch"><span>Completar com zeros (007)</span><input type="checkbox" data-key="zeroPad"></label>
    </div>
    <label class="switch"><span>Não repetir quem já foi sorteado</span><input type="checkbox" data-key="noRepeat"></label>
    <p class="hint" id="available"></p>
  </section>

  <section>
    <h2>Animação</h2>
    <div class="segmented" data-key="animation">
      <button data-value="0">Vertical</button>
      <button data-value="1">Horizontal</button>
      <button data-value="2">No lugar</button>
    </div>
    <label class="field"><span>Duração <output data-for="duration" data-unit=" s" data-digits="1"></output></span>
      <input type="range" data-key="duration" min="0.5" max="60" step="0.5"></label>
    <label class="field"><span>Velocidade inicial <output data-for="speed" data-unit=" itens/s" data-digits="0"></output></span>
      <input type="range" data-key="speed" min="2" max="100" step="1"></label>
    <label class="field"><span>Desaceleração <output data-for="decel" data-digits="1"></output></span>
      <input type="range" data-key="decel" min="1" max="8" step="0.1"></label>
    <p class="hint">1 = para de forma constante · 8 = passa rápido e demora para parar</p>
    <label class="field"><span>Itens visíveis ao redor <output data-for="neighbors" data-digits="0"></output></span>
      <input type="range" data-key="neighbors" min="0" max="4" step="1"></label>
  </section>

  <section>
    <h2>Visual</h2>
    <label class="field"><span>Fonte</span>
      <select id="font" data-key="fontPath"><option value="">Padrão do sistema</option></select></label>
    <label class="field"><span>Tamanho do texto <output data-for="textSize" data-percent></output></span>
      <input type="range" data-key="textSize" min="0.02" max="0.6" step="0.01"></label>
    <label class="field"><span>Posição vertical <output data-for="posY" data-percent></output></span>
      <input type="range" data-key="posY" min="0" max="1" step="0.01"></label>
    <label class="field"><span>Contorno <output data-for="outline" data-percent></output></span>
      <input type="range" data-key="outline" min="0" max="1" step="0.01"></label>
    <div class="colors">
      <label><input type="color" data-key="textColor"> Texto</label>
      <label><input type="color" data-key="winnerColor"> Sorteado</label>
      <label><input type="color" data-key="outlineColor"> Contorno</label>
      <label><input type="color" data-key="bgColor"> Fundo</label>
    </div>
    <label class="field"><span>Opacidade do fundo <output data-for="bgOpacity" data-percent></output></span>
      <input type="range" data-key="bgOpacity" min="0" max="1" step="0.01"></label>
  </section>

  <section>
    <h2>Textos</h2>
    <label class="field"><span>Título (aparece no topo)</span><input type="text" data-key="title" placeholder="Ex.: Sorteio de brindes"></label>
    <label class="field"><span>Texto de espera (antes de sortear)</span><input type="text" data-key="idleText"></label>
    <label class="switch"><span>Mostrar endereço deste painel na tela de espera</span><input type="checkbox" data-key="showAddress"></label>
  </section>

  <section class="wide">
    <h2>Histórico</h2>
    <ol id="history"></ol>
    <div class="actions">
      <button class="ghost" id="copyHistory">Copiar lista</button>
      <button class="ghost" id="resetHistory">Zerar histórico</button>
    </div>
  </section>
</main>

<footer>
  Atalhos para Stream Deck / Companion: <code>/api/start?canal=1</code> · <code>/api/clear?canal=1</code><br>
  Criado por Samuel Vieira · <a href="https://www.instagram.com/osamuelvieira.tecnica/" target="_blank" rel="noopener">@osamuelvieira.tecnica</a>
</footer>

<script>
(() => {
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  let channel = Number(localStorageGet('canal')) || 1;
  let state = null;
  let lastRevision = -1;
  let pending = {};        // edits not yet sent
  let sendTimer = null;
  let pollTimer = null;
  const editing = new Set(); // keys the user is touching right now; never overwritten by polling

  function localStorageGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
  function localStorageSet(key, value) { try { localStorage.setItem(key, value); } catch {} }

  const toHex = (rgb) => '#' + rgb.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('');
  const fromHex = (hex) => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);

  async function api(path, body) {
    const sep = path.includes('?') ? '&' : '?';
    const res = await fetch(`${path}${sep}canal=${channel}`, body === undefined ? {} : {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    return res.json();
  }

  function setConnected(ok, text) {
    $('#dot').classList.toggle('on', ok);
    $('#statusText').textContent = text;
  }

  // ---------- rendering ----------
  function renderChannels(count) {
    const tabs = $('#channels');
    if (tabs.children.length === count) return;
    tabs.innerHTML = '';
    for (let i = 1; i <= count; i++) {
      const b = document.createElement('button');
      b.textContent = `Canal ${i}`;
      b.setAttribute('role', 'tab');
      b.onclick = () => { channel = i; localStorageSet('canal', i); lastRevision = -1; pending = {}; renderTabs(); poll(); };
      tabs.appendChild(b);
    }
    renderTabs();
  }
  function renderTabs() {
    $$('#channels button').forEach((b, i) => b.classList.toggle('active', i + 1 === channel));
  }

  function renderLive(s) {
    const display = $('#display');
    display.textContent = s.display || '—';
    display.classList.toggle('result', s.phase === 'result');
    $('#phase').textContent = { idle: 'Aguardando', spinning: 'Sorteando…', result: 'Resultado' }[s.phase];
    $('#progress').style.width = `${Math.round(s.progress * 100)}%`;
    $('#message').textContent = s.message || '';
    $('#start').disabled = s.phase === 'spinning';
    $('#available').textContent = s.config.noRepeat
      ? `${s.available} de ${s.total} disponíveis para sortear`
      : `${s.total} opções`;
  }

  function renderHistory(history) {
    const list = $('#history');
    list.innerHTML = '';
    if (!history.length) {
      list.innerHTML = '<li class="empty">Ninguém sorteado ainda.</li>';
      return;
    }
    history.forEach((name, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="n">${i + 1}º</span><span class="name"></span><button title="Remover do histórico" aria-label="Remover">×</button>`;
      li.querySelector('.name').textContent = name;
      li.querySelector('button').onclick = () => api(`/api/history/remove?index=${i}`, {}).then(apply).catch(showError);
      list.appendChild(li);
    });
  }

  function renderConfig(cfg) {
    for (const el of $$('[data-key]')) {
      const key = el.dataset.key;
      if (editing.has(key) || key in pending) continue;
      const value = cfg[key];
      if (el.classList.contains('segmented')) {
        $$('button', el).forEach(b => b.classList.toggle('active', Number(b.dataset.value) === value));
      } else if (el.type === 'checkbox') {
        el.checked = !!value;
      } else if (el.type === 'color') {
        el.value = toHex(value);
      } else if (el.id === 'font') {
        ensureFontOption(value);
        el.value = value;
      } else {
        el.value = value;
      }
    }
    renderOutputs();
    renderModeFields();
  }

  function currentValue(key) {
    if (key in pending) return pending[key];
    return state ? state.config[key] : undefined;
  }

  function renderOutputs() {
    for (const out of $$('output[data-for]')) {
      const v = Number(currentValue(out.dataset.for));
      if (Number.isNaN(v)) continue;
      out.textContent = out.hasAttribute('data-percent')
        ? `${Math.round(v * 100)}%`
        : v.toFixed(Number(out.dataset.digits || 0)) + (out.dataset.unit || '');
    }
    const lines = ($('#listText').value || '').split('\n').filter(l => l.trim()).length;
    $('#listCount').textContent = `${lines} ${lines === 1 ? 'item' : 'itens'}`;
  }

  function renderModeFields() {
    const numbers = Number(currentValue('mode')) === 1;
    $('#listFields').classList.toggle('hidden', numbers);
    $('#numberFields').classList.toggle('hidden', !numbers);
  }

  function apply(s) {
    state = s;
    setConnected(true, 'Conectado');
    renderChannels(s.numChannels);
    renderLive(s);
    if (s.revision !== lastRevision) {
      lastRevision = s.revision;
      renderConfig(s.config);
      renderHistory(s.history);
    }
    schedulePoll();
  }

  function showError(err) {
    $('#message').textContent = err.message || String(err);
  }

  // ---------- polling ----------
  function schedulePoll() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(poll, state && state.phase === 'spinning' ? 120 : 800);
  }
  async function poll() {
    try {
      apply(await api('/api/state'));
    } catch {
      setConnected(false, 'Sem conexão com o Resolume');
      clearTimeout(pollTimer);
      pollTimer = setTimeout(poll, 2000);
    }
  }

  // ---------- editing ----------
  function queue(key, value, delay = 250) {
    pending[key] = value;
    renderOutputs();
    renderModeFields();
    clearTimeout(sendTimer);
    sendTimer = setTimeout(flush, delay);
  }
  async function flush() {
    const body = pending;
    if (!Object.keys(body).length) return;
    try {
      const s = await api('/api/config', body);
      // Only forget the keys that were not edited again while the request was in flight.
      for (const k of Object.keys(body)) if (pending[k] === body[k]) delete pending[k];
      lastRevision = -1;
      apply(s);
    } catch (err) {
      showError(err);
    }
  }

  function valueOf(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.type === 'color') return fromHex(el.value);
    if (el.type === 'range' || el.type === 'number') return Number(el.value);
    return el.value;
  }

  for (const el of $$('[data-key]')) {
    const key = el.dataset.key;
    if (el.classList.contains('segmented')) {
      $$('button', el).forEach(b => b.addEventListener('click', () => {
        $$('button', el).forEach(o => o.classList.toggle('active', o === b));
        queue(key, Number(b.dataset.value), 0);
      }));
      continue;
    }
    const slow = el.tagName === 'TEXTAREA' || el.type === 'text';
    el.addEventListener('focus', () => editing.add(key));
    el.addEventListener('blur', () => { editing.delete(key); if (key in pending) flush(); });
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
      if (el.type === 'number' && el.value === '') return;
      queue(key, valueOf(el), slow ? 700 : 200);
    });
  }

  $('#start').onclick = () => api('/api/start', {}).then(apply).catch(showError);
  $('#clear').onclick = () => api('/api/clear', {}).then(apply).catch(showError);
  $('#resetHistory').onclick = () => {
    if (confirm('Zerar o histórico deste canal? Todos voltam a poder ser sorteados.'))
      api('/api/reset-history', {}).then(apply).catch(showError);
  };
  $('#copyHistory').onclick = async () => {
    const text = (state ? state.history : []).map((n, i) => `${i + 1}. ${n}`).join('\n');
    try { await navigator.clipboard.writeText(text); $('#copyHistory').textContent = 'Copiado!'; }
    catch { prompt('Copie a lista:', text); }
    setTimeout(() => $('#copyHistory').textContent = 'Copiar lista', 1500);
  };

  // ---------- fonts ----------
  function ensureFontOption(path) {
    const select = $('#font');
    if (!path || $$('option', select).some(o => o.value === path)) return;
    const o = document.createElement('option');
    o.value = path;
    o.textContent = path.split(/[\\/]/).pop();
    select.appendChild(o);
  }
  fetch('/api/fonts').then(r => r.json()).then(({ fonts }) => {
    const select = $('#font');
    const chosen = currentValue('fontPath');
    for (const f of fonts) {
      if ($$('option', select).some(o => o.value === f.path)) continue;
      const o = document.createElement('option');
      o.value = f.path;
      o.textContent = f.name;
      select.appendChild(o);
    }
    if (chosen !== undefined) select.value = chosen;
  }).catch(() => {});

  // Space bar starts a draw when not typing, handy on a laptop next to the operator.
  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    e.preventDefault();
    if (!$('#start').disabled) $('#start').click();
  });

  poll();
})();
</script>
</body>
</html>
